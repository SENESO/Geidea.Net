name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore Geidea.Net.sln

    - name: Build
      run: dotnet build Geidea.Net.sln -c Release --no-restore

    - name: Test
      run: dotnet test tests/Geidea.Net.Tests/Geidea.Net.Tests.csproj -c Release --no-build --verbosity normal
